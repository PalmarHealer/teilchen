name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC token for the sites deploy API

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  # The Android app (TWA, see android/): built every deploy, signed once the key is set up.
  # Secrets: ANDROID_KEYSTORE_BASE64 (PKCS12, alias "teilchen") and ANDROID_KEYSTORE_PASSWORD.
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build
        working-directory: android
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleRelease --no-daemon
      - name: Sign
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::notice::No signing key yet: the site goes out without the APK"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/teilchen.keystore"
          # assetlinks.json must name this key, or the app shows an address bar
          FP=$(keytool -list -v -keystore "$RUNNER_TEMP/teilchen.keystore" -alias teilchen             -storepass "$ANDROID_KEYSTORE_PASSWORD" | sed -n 's/^[[:space:]]*SHA256: //p')
          grep -q "'$FP'" src/lib/android.ts || {
            echo "::error::Set ANDROID_CERT_SHA256 in src/lib/android.ts to '$FP'"
            exit 1
          }
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -f -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/teilchen.keystore" --ks-key-alias teilchen             --ks-pass env:ANDROID_KEYSTORE_PASSWORD --out teilchen.apk "$RUNNER_TEMP/aligned.apk"
          rm "$RUNNER_TEMP/teilchen.keystore"
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: teilchen.apk
          if-no-files-found: ignore
          retention-days: 1

  deploy:
    needs: [verify, apk]
    runs-on: ubuntu-latest
    # Same base as the site's runtime (Node 24 on Alpine), so native modules match
    container: node:24-alpine
    steps:
      - run: apk add --no-cache curl jq tar git
      - uses: actions/checkout@v7
      # A static file like the icons (only files there at build time are served); missing while
      # there is no signing key
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: apk
          path: static
      - name: Build
        run: |
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm exec svelte-kit sync && pnpm build
      - name: Assemble the release
        run: |
          # Flat production node_modules: the upload keeps no symlinks
          rm -rf node_modules
          pnpm install --prod --frozen-lockfile --ignore-scripts --config.node-linker=hoisted
          mkdir out
          cp -r package.json node_modules build src drizzle out/
          # sites starts the app with `npm start`: migrations first, as the image did
          node -e 'const f="out/package.json",p=require("./"+f);p.scripts={start:"node node_modules/tsx/dist/cli.mjs src/lib/server/db/migrate.ts && BODY_SIZE_LIMIT=10M node build"};require("fs").writeFileSync(f,JSON.stringify(p,null,2))'
          tar -czf release.tar.gz --hard-dereference --exclude='node_modules/.bin' -C out .
          ls -lh release.tar.gz
      - name: Deploy to sites
        run: |
          TOKEN=$(curl -sSf --retry 5 --retry-all-errors -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://sites.nauren.de" | jq -r .value)
          curl -sSf -X POST -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/gzip"             --data-binary @release.tar.gz             "https://sites.nauren.de/api/v1/deploy?site=6d291c05-ff6d-4d61-8dc7-e24193b39fdd"
